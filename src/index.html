<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OVO</title>

  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCpVhQiwAllg1RAFaxMWSpQruuGARy0Y1k&libraries=places"></script>
</head>
<body>
  <ngx-app>Loading...</ngx-app>

  <style>
    #ovo-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #00a651; /* solid green */
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      flex-direction: column;
    }
    #ovo-splash .message {
      color: #ffffff;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.2px;
      text-align: center;
    }
    #ovo-splash .speak {
      margin-top: 16px;
      background: #ffffff;
      color: #00a651;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: none; /* shown if autoplay blocked */
    }
  </style>
  <div id="ovo-splash">
    <div class="message">OVO: See everything, improve everything</div>
  </div>

  

</body>
</html>
